# mpv settings for the background radio, tuned for minimal memory.
# The audio format and the volume are passed by musictty on the command line.
# Options an older mpv doesn't know are reported in the log and skipped.

# audio only: no windows, no video subsystem
vid=no
audio-display=no
force-window=no
idle=yes
terminal=no

ytdl-raw-options=no-playlist=,no-write-subs=

# minimal buffers: ~256 KiB ahead ≈ 15 s of sound, nothing kept behind
cache=yes
demuxer-max-bytes=256KiB
demuxer-max-back-bytes=0
demuxer-readahead-secs=5
cache-secs=15
stream-buffer-size=32KiB
audio-buffer=0.1

# no subtitles, cover art or OSD
sid=no
sub-auto=no
cover-art-auto=no
osd-level=0

# built-in scripts and UI that are useless without a window
osc=no
load-stats-overlay=no
load-console=no
load-commands=no
load-select=no
load-positioning=no
load-auto-profiles=no
input-default-bindings=no
input-builtin-bindings=no

# media keys and the Windows overlay cost ~1.5 MB private memory and ~8 MB working set.
# Set to yes if you want the keyboard buttons.
media-controls=no

replaygain=track
