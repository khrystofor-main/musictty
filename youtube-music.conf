# Настройки mpv для фонового радио с минимальным потреблением памяти

# только звук, никаких окон и видео-подсистемы
vid=no
audio-display=no
force-window=no
idle=yes
terminal=no

# лёгкий аудиопоток (opus/m4a ~128–160 кбит/с)
ytdl-format=bestaudio[acodec=opus]/bestaudio/best
ytdl-raw-options=no-playlist=,no-write-subs=

# минимальные буферы: ~256 КиБ вперёд ≈ 15 с звука, назад ничего не храним
cache=yes
demuxer-max-bytes=256KiB
demuxer-max-back-bytes=0
demuxer-readahead-secs=5
cache-secs=15
stream-buffer-size=32KiB
audio-buffer=0.1

# никаких субтитров, обложек и OSD
sid=no
sub-auto=no
cover-art-auto=no
osd-level=0

# отключаем встроенные скрипты и интерфейс, которые не нужны без окна
osc=no
load-stats-overlay=no
load-console=no
load-commands=no
load-select=no
load-positioning=no
load-auto-profiles=no
input-default-bindings=no
input-builtin-bindings=no

# медиаклавиши и плашка Windows стоят ~1,5 МБ личной памяти и ~8 МБ рабочего набора.
# Нужны кнопки на клавиатуре — поставьте yes.
media-controls=no

volume=70
replaygain=track
